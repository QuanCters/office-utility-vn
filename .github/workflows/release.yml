name: Release & Build Matrix

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Target release tag (must match v*.*.*)'
        required: true
        type: string
      target_commit:
        description: 'Expected commit SHA for verification'
        required: false
        type: string
      publish_release:
        description: 'Authorize public release publication (requires maintainer review)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-release-gate:
    name: Release Gate Verification (L5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Verify Spine Lock
        run: ./scripts/verify_spine_lock.sh

      - name: Verify Pinned Vendor Dependencies
        run: python3 harness/runner/run.py --check-vendor-pin

      - name: Verify Pre-Build Artifact Provenance
        run: python3 harness/runner/evidence.py --verify-artifacts

  build-tauri:
    name: Build Tauri Packages (${{ matrix.platform }})
    needs: [verify-release-gate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'macos-latest'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            wasm32-unknown-unknown,
            ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Build binaries and packages without publishing or creating draft releases
      - name: Build Tauri Application (Verification & Candidate Artifacts Only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Mandatory post-build dist verification (P2 #4679604061 / Requirement 4)
      - name: Verify Post-Build Dist Artifacts Fail-Closed
        shell: bash
        run: python3 harness/runner/evidence.py --verify-artifacts --check-dist --dist-required

      - name: Verify Package Artifact Availability
        shell: bash
        run: |
          echo "Verifying generated platform-specific package artifacts exist..."
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            PKG_COUNT=$(find src-tauri/target -path "*/bundle/*" \( -name "*.exe" -o -name "*.msi" \) | wc -l)
            if [ "$PKG_COUNT" -eq 0 ]; then
              echo "❌ Error: Required Windows package artifacts (*.exe or *.msi) not found in bundle directory!"
              exit 1
            fi
            echo "✓ Found $PKG_COUNT Windows package artifact(s)."
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            PKG_COUNT=$(find src-tauri/target -path "*/bundle/*" \( -name "*.dmg" -o -name "*.app" \) | wc -l)
            if [ "$PKG_COUNT" -eq 0 ]; then
              echo "❌ Error: Required macOS package artifacts (*.dmg or *.app) not found in bundle directory!"
              exit 1
            fi
            echo "✓ Found $PKG_COUNT macOS package artifact(s)."
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: office-utility-vn-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app
          if-no-files-found: error

  # PUBLICATION FREEZE: Production release publication strictly frozen per Product Owner Decision
  # Disabled until separate Product Owner release authorization is issued.
  publish-release:
    name: Authorized Public Release Publication (FROZEN - UNAUTHORIZED)
    needs: [verify-release-gate, build-tauri]
    if: false # Publication strictly unauthorized until Product Owner release authorization is issued
    environment: production-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Release Authorization Inputs
        shell: bash
        run: |
          TARGET_TAG="${{ inputs.target_tag }}"
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "❌ Invalid release tag format: '$TARGET_TAG'. Must match ^v[0-9]+\.[0-9]+\.[0-9]+.*"
            exit 1
          fi

          EXPECTED_COMMIT="${{ inputs.target_commit }}"
          if [[ -n "$EXPECTED_COMMIT" ]]; then
            CURRENT_COMMIT="$(git rev-parse HEAD)"
            if [[ "$CURRENT_COMMIT" != "$EXPECTED_COMMIT"* ]]; then
              echo "❌ Release commit mismatch: expected '$EXPECTED_COMMIT', got '$CURRENT_COMMIT'"
              exit 1
            fi
            echo "✓ Release commit authorization verified ($CURRENT_COMMIT)"
          fi

      - name: Download Verified Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: office-utility-vn-windows-latest
          path: ./release-artifacts/windows

      - name: Download Verified macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: office-utility-vn-macos-latest
          path: ./release-artifacts/macos

      - name: Prevent Duplicate Release & Publish Authorized Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.target_tag }}"
          if gh release view "$TARGET_TAG" > /dev/null 2>&1; then
            echo "❌ Release '$TARGET_TAG' already exists! Duplicate release creation prevented."
            exit 1
          fi

          echo "📦 Publishing authorized release $TARGET_TAG..."
          gh release create "$TARGET_TAG" \
            ./release-artifacts/windows/* \
            ./release-artifacts/macos/* \
            --title "Release $TARGET_TAG" \
            --notes "Authorized production release $TARGET_TAG verified by L5 Release Gate."
          echo "✅ Release $TARGET_TAG published successfully."
