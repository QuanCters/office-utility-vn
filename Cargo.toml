[package]
name = "office-utility-vn-ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEvent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
office-engine = { path = "crates/office-engine" }
office-shared = { path = "crates/office-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
paste = "1.0"
criterion = { version = "0.5", default-features = false }
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
crc32fast = "1.4"

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[workspace]
members = [
    "src-tauri",
    "crates/office-shared",
    "crates/office-engine",
]

# Size and speed optimizations for release binaries (Windows, macOS, Linux)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
