[package]
name = "office-utility-vn-ui"
version = "0.2.3"
edition = "2024"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEvent", "Window", "Storage", "Document", "Element", "Navigator", "Clipboard", "MessageEvent", "HtmlIFrameElement", "Location"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
tachys = { version = "0.2", features = ["ssr"] }
office-engine = { path = "crates/office-engine" }
office-shared = { path = "crates/office-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
paste = "1.0"
sha2 = "0.10"
criterion = { version = "0.5", default-features = false }
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
crc32fast = "1.4"

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[workspace]
members = [
    "src-tauri",
    "crates/office-shared",
    "crates/office-engine",
]
exclude = [
    "vendor/pdfcraft",
    "vendor/gridcraft",
]

# Size and speed optimizations for release binaries (Windows, macOS, Linux)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Fast compilation, reduced RAM peak, and lean target directory for dev/tests
[profile.dev]
debug = 1

# Strip debug symbols from 3rd-party dependencies (GTK, WebKit, Tokio, etc.) to keep target/ slim
[profile.dev.package."*"]
opt-level = 2
debug = 0

# Fast test compilation and lean test binary sizes
[profile.test]
debug = 1

[profile.test.package."*"]
opt-level = 2
debug = 0
