[package]
name = "office-utility-vn-ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEvent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"

[workspace]
members = [
    "src-tauri",
    "crates/office-shared",
    "crates/office-engine",
]

# Size and speed optimizations for release binaries (Windows, macOS, Linux)
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
