[package]
name = "office-engine"
version = "0.2.0"
edition = "2024"

[dependencies]
office-shared = { path = "../office-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
zeroize = { version = "1", features = ["derive"] }
infer = "0.16"
quick-xml = "0.42"
flate2 = "1.0"
sha2 = "0.10"
base64 = "0.22"
regex = "1.10"
aho-corasick = "1.1"
crc32fast = "1.4"
chrono = "0.4"
calamine = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
puremp3 = "0.1"

[dev-dependencies]
