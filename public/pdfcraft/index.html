<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Studio Canvas</title>
    
<script type="module">
import init, * as bindings from './pdfcraft-web-8a0108e9d87ca309.js';

window.addEventListener("error", function(e) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "pdfcraft:failed", error: e.message || "Lỗi khởi động Canvas WebAssembly" }, "*");
    }
  } catch (err) {}
});

try {
  const wasm = await init({ module_or_path: './pdfcraft-web-f6ab9f480a6298c5_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

  // Chủ động gửi thông báo ready tới Leptos Host để gỡ bỏ Loading Skeleton
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "pdfcraft:ready", version: "0.2.2" }, "*");
  }
} catch (err) {
  console.error("Lỗi khởi tạo WASM PDFCraft:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "pdfcraft:failed", error: String(err) }, "*");
  }
}
</script>
    <script>
      // Office Utility VN: Đồng bộ Dark Theme & Ngôn ngữ tiếng Việt trước khi khởi động Canvas
      try {
        const params = new URLSearchParams(window.location.search);
        const theme = params.get('theme') || 'Dark';
        const lang = params.get('lang') || 'vi';
        let saved = {};
        try {
          saved = JSON.parse(localStorage.getItem('pdfcraft') || '{}');
        } catch (e) {}
        saved.theme = theme.toLowerCase() === 'light' ? 'Light' : 'Dark';
        saved.language = lang;
        saved.community_card_closed = true;
        localStorage.setItem('pdfcraft', JSON.stringify(saved));
      } catch (e) {}
    </script>
    <style>
      :root {
        --pc-bg: #0f172a;
        --pc-surface: #1e293b;
        --pc-card: #1e293b;
        --pc-border: #334155;
        --pc-text: #f8fafc;
        --pc-text-dim: #94a3b8;
        --pc-accent: #6366f1;
        --pc-radius: 6px;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--pc-bg);
        color: var(--pc-text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: var(--pc-bg); } }
    </style>
